            width: 80vw;

    <script>
        // 1. IMPROVED DYNAMIC RESIZER
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) {
                    iframe.style.height = event.data.frameHeight + "px";
                }
            }
        });

        // 2. URL CONSTRUCTOR & DIMENSION HANDLER
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                
                // Collect ALL data attributes automatically
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-')) {
                        const key = attr.name.substring(5).replace(/-/g, '_');
                        if (key !== 'base_url') params.push(`${key}=${encodeURIComponent(attr.value)}`);
                    }
                }

                // IMPORTANT: If client used standard 'width' attribute, pass it as 'width' param
                const standardWidth = iframe.getAttribute('width');
                const dataWidth = iframe.getAttribute('data-width');
                if (standardWidth && !dataWidth) {
                   params.push(`width=${encodeURIComponent(standardWidth)}`);
                }

                iframe.src = baseUrl + '?' + params.join('&');
            });
        });

        function testInjection(targetId, msg, color) {
            const frame = document.getElementById(targetId);
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({
                    type: 'THEMEX_UPDATE',
                    config: { message: msg, accent_color: color }
                }, '*');
            }
        }

        function testPricing() {
            const frame = document.getElementById('price-card-1');
            if (frame && frame.contentWindow) {
                frame.contentWindow.postMessage({
                    type: 'THEMEX_UPDATE',
                    config: {
                        plan_name: "Enterprise Rose",
                        price: "$199",
                        features: "Custom Domain, Dedicated Support, White Labeling",
                        highlighted: "true",
                        accent_color: "a43939"
                    }
                }, '*');
            }
        }
    </script>
