        iframe { width: 100%; border: none; display: block; overflow: hidden; }

</head>
<body>
    <div class="preview">
        
        <!-- Navbar -->

        <!-- About Text -->
        <iframe 
            id="symmetry-about"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/text-block.html"
            data-frame-id="symmetry-about"
            data-heading="About our restaurant"
            data-content="The menu at a modern seafood restaurant meets innovation. Chefs incorporate cutting-edge techniques to redefine classics like ceviches with exotic fruit infusions, deconstructed sushi rolls with unexpected twists, and seafood pastas with artisanal flair."
        ></iframe>

        <!-- Menu Grid -->
        <iframe 
            id="symmetry-menu"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/menu-grid.html"
            data-frame-id="symmetry-menu"
            data-heading="Our menu"
            data-item1_title="Fresh Oysters" data-item1_desc="Served with lemon and tabasco." data-item1_img="https://images.unsplash.com/photo-1534604973900-c43ab4c2e0ab?auto=format&fit=crop&w=600&q=80"
            data-item2_title="Grilled Sea Bass" data-item2_desc="With seasonal vegetables." data-item2_img="https://images.unsplash.com/photo-1534604973900-c43ab4c2e0ab?auto=format&fit=crop&w=600&q=80"
        ></iframe>

        <!-- Events List -->
        <iframe 
            id="symmetry-events"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/events-list.html"
            data-frame-id="symmetry-events"
            data-brand="Coral Cove"
            data-heading="restaurant events"
            data-event1_date="15 FEB / Wine and dine 7-9 PM / $50" data-event1_desc="Indulge in an evening of elegance as we present a curated wine pairing experience."
            data-event1_icon="fa-solid fa-wine-glass"

            data-event2_icon="fa-solid fa-martini-glass-citrus"
            data-cta_text="Book Now"

            data-accent_color="d4a373"
        ></iframe>

        <!-- Features -->
        <iframe 
            id="symmetry-features"

            data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/features.html"
            data-frame-id="symmetry-features"
            data-title1="Locally Sourced" data-desc1="We work with local fishermen." data-icon1="fa-solid fa-anchor"

            data-title3="Ocean View" data-desc3="Dining with a view." data-icon3="fa-solid fa-water"

        <!-- Accordion -->
        <iframe

        <!-- Newsletter -->
        <iframe id="symmetry-news" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/newsletter.html" data-frame-id="symmetry-news" data-heading="Join our list" data-description="Get the latest news and event updates."></iframe>

        <!-- Footer -->
        <iframe 
            id="symmetry-footer"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/symmetry/footer.html"
            data-frame-id="symmetry-footer"
            data-brand="Coral Cove"
            data-col1_content="Reservation|#,About|#,Menu|#,Our Story|#,Events|#,Interior|#"
            data-col2_content="Park Avenue, 80146 NY, USA,+39-926-1234567,info@coralcove"
            data-col3_content="Instagram|#,Facebook|#"
        ></iframe>

    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-') && attr.name !== 'data-base-url' && attr.name !== 'data-frame-id') {
                        params.push(`${attr.name.substring(5)}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&') + '&frame_id=' + iframe.id;
            });
        });
    </script>
</body>
</html>
