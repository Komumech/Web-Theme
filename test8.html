<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Theme Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #ffffff;
        }
        
        .preview-container {
            width: 100%;
            min-height: 100vh;
            max-width: 1400px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            border: none;
            display: block;
            overflow: hidden;
        }
        
        .grid-section {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
        }
    </style>
</head>
<body>

    <div class="preview-container">
        <!-- Navbar Snippet -->
        <iframe 
            id="recipe-navbar"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/navbar.html"
            data-frame-id="recipe-navbar"
            data-brand="Blue Sky"
            data-brand_sub="EATING."
            data-link1_text="HOME" data-link1_href="#"
            data-link2_text="RECIPES" data-link2_href="#"
            data-link3_text="ABOUT" data-link3_href="#"
            data-link4_text="CONTACT" data-link4_href="#"
            data-bg_color="ffffff"
            data-text_color="333333"
            data-accent_color="dbeafe"
            data-brand_color="1a1a1a"
            data-hover_color="3b82f6"
        ></iframe>

        <!-- Hero/Content Snippet -->
        <iframe 
            id="recipe-hero"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/hero.html"
            data-frame-id="recipe-hero"
            data-main_heading="LATEST RECIPES..."
            data-recipe1_img="https://images.unsplash.com/photo-1604908176997-125f25cc6f3d?auto=format&fit=crop&w=600&q=80"
            data-recipe1_title="CHICKEN AVOCADO PASTA"
            data-recipe2_img="https://images.unsplash.com/photo-1595295333158-4742f28fbd85?auto=format&fit=crop&w=600&q=80"
            data-recipe2_title="SAUSAGE AND VEG TRAY BAKE"
            data-sidebar_title="WELCOME! 👋"
            data-profile_img="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=300&q=80"
            data-bio_text="I'm Catherine - the recipe developer and food photographer behind Blue Sky Eating. Here you'll find plenty of delicious gluten free foodie inspiration."
            data-newsletter_text="WANT EVERY NEW RECIPE SENT STRAIGHT TO YOUR INBOX? ♥"
            data-bg_color="ffffff"
            data-text_color="555555"
            data-heading_color="111111"
            data-accent_bg="f3f4f6"
        ></iframe>

        <!-- Features / Categories Grid -->
        <div class="grid-section">
            <iframe 
                id="card-1" 
                src="" 
                data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/card.html" 
                data-frame-id="card-1"
                data-icon="🥑" 
                data-title="Keto Recipes" 
                data-description="Low carb, high fat recipes that taste amazing." 
                data-btn_text="View Keto"
            ></iframe>
            <iframe 
                id="card-2" 
                src="" 
                data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/card.html" 
                data-frame-id="card-2"
                data-icon="🥦" 
                data-title="Vegan Eats" 
                data-description="Plant-based goodness for every meal of the day." 
                data-btn_text="View Vegan"
            ></iframe>
            <iframe 
                id="card-3" 
                src="" 
                data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/card.html" 
                data-frame-id="card-3"
                data-icon="🍰" 
                data-title="Desserts" 
                data-description="Sweet treats that are actually good for you." 
                data-btn_text="View Sweets"
            ></iframe>
        </div>

        <!-- Testimonial -->
        <iframe 
            id="recipe-testimonial"
            src=""
            scrolling="no"
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/testimonial.html"
            data-frame-id="recipe-testimonial"
            data-quote="I made the chicken avocado pasta for my family and they absolutely loved it! It's now a weekly staple."
            data-author="Sarah Jenkins"
            data-role="Home Cook"
            data-avatar="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80"
            data-bg_color="f9fafb"
        ></iframe>

        <!-- FAQ Accordion -->
        <iframe 
            id="recipe-faq"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/accordion.html"
            data-frame-id="recipe-faq"
            data-title="Cooking Tips & Tricks"
            data-q1="Can I substitute almond flour?" data-a1="Yes, in most of our baking recipes, almond flour works as a 1:1 substitute."
            data-q2="Are these recipes gluten-free?" data-a2="All recipes marked with the GF tag are 100% gluten-free."
            data-q3="How do I store leftovers?" data-a3="We recommend airtight glass containers for up to 3 days in the fridge."
        ></iframe>

        <!-- Newsletter Strip -->
        <iframe 
            id="recipe-newsletter"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/newsletter.html"
            data-frame-id="recipe-newsletter"
            data-heading="Don't Miss a Bite"
            data-subheading="Join 10,000+ subscribers getting fresh recipes weekly."
            data-btn_text="Sign Me Up"
            data-bg_color="dbeafe"
        ></iframe>

        <!-- New Snippets Section -->
        <div style="max-width: 1100px; margin: 40px auto; padding: 20px;">
            <h2 style="text-align: center; font-family: sans-serif; color: #ccc;">--- NEW SNIPPETS ---</h2>
            
            <!-- Features -->
            <iframe id="recipe-features" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/features.html" data-frame-id="recipe-features"
                data-title1="Fresh Ingredients" data-desc1="We use only the best locally sourced produce."
                data-title2="Easy to Follow" data-desc2="Step-by-step guides for every level."
                data-title3="Quick Meals" data-desc3="Dinner on the table in under 30 mins."
                data-title4="Healthy Options" data-desc4="Nutritious meals for the whole family."
                data-icon_bg="dbeafe"
            ></iframe>

            <!-- Image Section -->
            <iframe id="recipe-image" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/image-section.html" data-frame-id="recipe-image"
                data-bg_image="https://images.unsplash.com/photo-1490645935967-10de6ba17061?auto=format&fit=crop&w=1200&q=80"
                data-heading="Seasonal Favorites" data-subheading="Fall in love with autumn flavors"
            ></iframe>

            <!-- Pricing -->
            <iframe id="recipe-pricing" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/pricing-card.html" data-frame-id="recipe-pricing"
                data-plan="Weekly Meal Plan" data-price="$19" data-features="5 Dinner Recipes, Shopping List, Prep Guide" data-cta_text="Start Cooking"
                data-accent_color="dbeafe"
            ></iframe>

            <!-- Team -->
            <iframe id="recipe-team" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/about-team.html" data-frame-id="recipe-team"
                data-label="Our Kitchen Team" data-description="Passionate foodies creating magic."
            ></iframe>

            <!-- UI Elements -->
            <div style="display: grid; gap: 20px; margin-top: 40px;">
                <iframe id="recipe-alert" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/alert.html" data-frame-id="recipe-alert"
                    data-message="New gluten-free recipes added this week!" data-type="info" data-accent_color="dbeafe"
                ></iframe>
                
                <iframe id="recipe-input" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/input.html" data-frame-id="recipe-input"
                    data-placeholder="Search recipes..." data-submit_text="Find" data-accent_color="1a1a1a"
                ></iframe>

                <div style="text-align: center;">
                    <iframe id="recipe-btn" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/button.html" data-frame-id="recipe-btn"
                        data-text="View All Recipes" data-href="#" data-accent_color="1a1a1a" style="width: 200px; display: inline-block;"
                    ></iframe>
                    <iframe id="recipe-btn-outline" src="" data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/button.html" data-frame-id="recipe-btn-outline"
                        data-text="Contact Us" data-href="#" data-type="outline" style="width: 200px; display: inline-block;"
                    ></iframe>
                </div>
            </div>
        </div>

        <!-- Footer -->
        <iframe 
            id="recipe-footer"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/recipe/footer.html"
            data-frame-id="recipe-footer"
            data-col1_title="Explore" data-col1_links="Home|#,Recipes|#,About|#"
            data-col2_title="Social" data-col2_links="Instagram|#,Pinterest|#,Facebook|#"
            data-col3_title="Legal" data-col3_links="Privacy Policy|#,Terms of Service|#"
            data-copyright="© 2026 Blue Sky Eating. Designed with ♥."
        ></iframe>
    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const iframes = document.querySelectorAll('iframe[data-base-url]');
            iframes.forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-') && attr.name !== 'data-base-url' && attr.name !== 'data-frame-id') {
                        params.push(`${attr.name.substring(5)}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&') + '&frame_id=' + iframe.id;
            });
        });
    </script>
</body>
</html>
