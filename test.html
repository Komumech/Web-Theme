    <script>
    // --- START KomuTheme Embed Code: Universal Handler ---

    document.addEventListener('DOMContentLoaded', function() {
        // 1. URL Construction Logic
        function constructSnippetUrl(iframe) {
            const baseUrl = iframe.getAttribute('data-base-url');
            if (!baseUrl) return;
            let params = [];
            for (const attr of iframe.attributes) {
                if (attr.name.startsWith('data-')) {
                    const paramKey = attr.name.substring(5).replace(/-/g, '_');
                    const paramValue = encodeURIComponent(attr.value);
                    if (paramKey !== 'base_url') {
                        params.push(`${paramKey}=${paramValue}`);
                    }
                }
            }
            iframe.src = baseUrl + '?' + params.join('&');
        }
        document.querySelectorAll('iframe[data-base-url]').forEach(constructSnippetUrl);
    });


    // 2. Universal Responsive Height Listener (PostMessage)
    window.addEventListener('message', function(event) {
        const YOUR_SNIPPET_ORIGIN = "https://themes-blush-one.vercel.app";
        if (event.origin !== YOUR_SNIPPET_ORIGIN) {
            return; 
        }
        if (event.data.frameId && event.data.frameHeight) {
            const targetIframe = document.getElementById(event.data.frameId);
            if (targetIframe) {
                const newHeight = event.data.frameHeight;
                targetIframe.style.transition = 'height 0.3s ease-out';
                targetIframe.style.height = newHeight + 'px';
            }
        }
    });

    // --- END KomuTheme Embed Code: Universal Handler ---
    </script>
