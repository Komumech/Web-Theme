            max-width: 900px;

            padding: 1rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid #ddd;

    <!-- Docked Navbar -->

    <div class="component-group">
