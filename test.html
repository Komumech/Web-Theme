<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Document</title>
</head>
<body>
    <style>
        body {
            font-family: sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding-top: 80px; /* Add padding to prevent content from hiding behind the docked navbar */
        }
        iframe {
            border: none; 
            box-shadow: none;
            width: 100%;
            margin-bottom: 2rem;
        }

        h2 {
            margin-top: 0;
            border-bottom: 2px solid #ddd;
            padding-bottom: 0.5rem;
        }
        .sample-section {
            height: 100vh;
            border: none;
            overflow-y: hidden;
        }
    </style>

    <!-- Docked Navbar -->
    <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/navbar.html?title=ThemeCorp&docked=true&link1_label=Home&link1_href=/&link2_label=Products&link2_href=/products&link3_label=Login&link3_href=/login" height="70"></iframe>

    <div class="component-group">
        <h2>Neon Theme Snippets</h2>
        <iframe src="https://themes-blush-one.vercel.app/snippets/neon/navbar.html?title=NEON&link1_label=CYBER&link1_href=#&link2_label=PUNK&link2_href=#" height="70"></iframe>
        <iframe src="https://themes-blush-one.vercel.app/snippets/neon/alert.html?type=warning&message=System+breach+detected." height="80"></iframe>
        <iframe src="https://themes-blush-one.vercel.app/snippets/neon/input.html?placeholder=Enter+Codename...&icon=user-secret" height="70"></iframe>
        <iframe src="https://themes-blush-one.vercel.app/snippets/neon/footer.html?copyright=--[+SYSTEM+ONLINE+]--&social1_icon=github&social1_href=#&social2_icon=gitlab&social2_href=#" height="120"></iframe>
    </div>

    <div class="component-group">
        <h2>Web Theme Snippets</h2>
        <p>Here are the import links for all the available web-theme components:</p>
        
        <h3>Navbar</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/navbar.html?title=MySite&link1_label=Home&link1_href=#&link2_label=Features&link2_href=#" height="70"></iframe>
        
        <h3>Buttons</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/button.html?text=Get Started" height="60"></iframe>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/button.html?text=Learn More&type=skeleton" height="60"></iframe>
        
        <h3>Alert</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/alert.html?type=success&message=Your changes have been saved." height="80"></iframe>
        
        <h3>Input Field</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/input.html?placeholder=Enter your email...&icon=envelope" height="70"></iframe>
        
        <h3>Card</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/card.html?title=Our Mission&content=To build beautiful, responsive, and accessible web components for everyone." height="180"></iframe>
        
        <h3>Footer</h3>
        <iframe src="https://themes-blush-one.vercel.app/snippets/web-theme/footer.html?social1_icon=twitter&social1_href=#&social2_icon=github&social2_href=#" height="130"></iframe>
    </div>
<iframe class="sample-section" src="https://themes-blush-one.vercel.app/snippets/sample.html" width="100%" height="500" style="border:none;"></iframe>

</body>
</html>
