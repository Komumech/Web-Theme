<script>
    /**
     * Handles the PostMessage event to dynamically resize an iframe.
     * @param {MessageEvent} event - The received message event.
     */
    function handleDynamicIframeResize(event) {
        // OPTIONAL SECURITY CHECK: If your component is always hosted on the same domain 
        // as the main page, you can skip the origin check or adjust it. 
        // If your component is hosted externally, you should verify event.origin.
        
        const data = event.data;

        // Ensure the message contains the necessary payload (height and ID)
        if (data.frameHeight && data.frameId) {
            // Find the iframe element in the current (parent) document by the reported ID
            const iframe = document.getElementById(data.frameId);

            if (iframe) {
                // Set the iframe's height to the reported content height
                // Adding a small buffer (+5px) helps prevent unwanted scrollbars.
                iframe.style.height = `${data.frameHeight + 5}px`;
                // console.log(`Resized iframe ${data.frameId} to ${data.frameHeight + 5}px`); // Optional logging
            }
        }
    }

    // Attach the handler to the window's message event
    window.addEventListener("message", handleDynamicIframeResize, false);
</script>
