<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MindMarket Theme Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }
        
        .theme-wrapper {
            position: relative;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            border: none;
            overflow: hidden;
            display: block;
        }

        #nav-frame {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            height: 100px; /* Initial height */
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            padding: 2rem;
        }
    </style>
</head>
<body>

    <div class="theme-wrapper">
        <!-- Navbar floats on top -->
        <iframe 
            id="nav-frame"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/wild/navbar.html"
            data-frame-id="nav-frame"
            data-brand="Wild"
            data-link1_text="Services" data-link1_href="#"
            data-link2_text="Methodology" data-link2_href="#"
            data-link3_text="Sectors" data-link3_href="#"
            data-cta_text="Get a Note"
            data-bg_color="transparent"
            data-pill_bg="ffffff"
            data-text_color="1a1a1a"
            data-green="33bd98"
            data-blue="000000"
            data-menu_link1_text="Home" data-menu_link1_href="#"
            data-menu_link2_text="About" data-menu_link2_href="#"
            data-menu_link3_text="Contact" data-menu_link3_href="#"
            scrolling="no"
        ></iframe>

        <!-- Hero Section -->
        <iframe 
            id="hero-frame"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/wild/hero.html"
            data-frame-id="hero-frame"
            data-
            data-title="Real human<br>insights"
            data-subtitle="We help you understand your customers better through data-driven empathy and real-world interactions."
            data-floater1_text="💡 Insights" data-floater1_bg="ffffff" data-floater1_color="1a1a1a"
            data-floater2_text="❤️ Empathy" data-floater2_bg="ffeb3b"
            data-floater3_text="📈 Growth" data-floater3_bg="ffffff"
            data-bg_color="33bd98"
            scrolling="no"
        ></iframe>

        <!-- Surprise Stats Section -->
        <iframe
            id="stats-frame"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/wild/stats.html"
            data-frame-id="stats-frame"
            data-stat1_val="10k+" data-stat1_label="Users"
            data-stat2_val="95%" data-stat2_label="Satisfaction"
            data-stat3_val="24/7" data-stat3_label="Support"
            data-stat4_val="#1" data-stat4_label="Product"
            scrolling="no"
        ></iframe>

        <!-- Cards Grid -->
        <div class="grid">
            <iframe
                id="card-1"
                src=""
                data-base-url="https://komutheme2.vercel.app/project/public/snippets/wild/card.html"
                data-frame-id="card-1"
                data-title="Strategy"
                data-description="We build comprehensive strategies that align with your business goals."
                data-icon="🎯"
                data-btn_text="Explore"
                scrolling="no"
            ></iframe>

            <iframe
                id="pricing-1"
                src=""
                data-base-url="https://komutheme2.vercel.app/project/public/snippets/wild/pricing-card.html"
                data-frame-id="pricing-1"
                data-plan="Pro Team"
                data-price="$49"
                data-features="Unlimited Projects, Priority Support, 5 Team Members, Analytics Dashboard"
                data-header_bg="82cf66"
                scrolling="no"
            ></iframe>
        </div>
    </div>

    <script>
        // 1. URL Construction Logic
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-')) {
                        let key = attr.name.substring(5).replace(/-/g, '_');
                        if (key === 'base_url') continue;
                        params.push(`${key}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&');
            });
        });

        // 2. Dynamic Resizing
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });
    </script>
</body>
</html>
