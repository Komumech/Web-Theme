<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server-Side Rendering Test Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        body {
            margin: 0; 
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }
        .test-case {
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            background: #fff;
        }
        h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
    </style>
    
    <h2>Server-Side Rendering Snippet Tests</h2>

    <div class="test-case">
        <h3>1. Free User (gets default free plan)</h3>
        <iframe
            id="free-card"
            src=""
            width="100%"
            height="450"
            style="border:none;"
            data-base-url="https://komutheme2.vercel.app/api/server"
            data-snippet-name="pricing-card"
            data-frame-id="free-card"
            data-token="abc123_free_token"
        ></iframe>
    </div>
    <div class="test-case">
        <h3>2. Free User (tries to use `highlighted=true`, is denied)</h3>
        <iframe
            id="free-hack-card"
            src=""
            width="100%"
            height="450"
            style="border:none;"
            data-base-url="https://komutheme2.vercel.app/api/server"
            data-snippet-name="pricing-card"
            data-frame-id="free-hack-card"
            data-token="abc123_free_token"
            data-highlighted="true"
        ></iframe>
    </div>
    <div class="test-case">
        <h3>3. Pro User (with full customizations)</h3>
        <iframe
            id="price-card-1"
            src=""
            width="100%"
            height="450"
            style="border:none;"
            data-base-url="https://komutheme2.vercel.app/api/server"
            data-snippet-name="pricing-card"
            data-frame-id="price-card-1"
            data-token="xyz789_pro_token"
            data-plan-name="Premium Pro"
            data-price="$299"
            data-interval="/yr"
            data-features="Advanced Analytics,Priority Support,5 Team Members,99.9% Uptime Guarantee"
            data-cta-text="Go Annual"
            data-primary-color="3b82f6"
            data-accent-color="ef4444"
            data-highlighted="true"
        ></iframe>
    </div>
    <div class="test-case">
        <h3>4. Pro User (Accordion with customizations)</h3>
        <iframe
            id="pro-accordion"
            src=""
            width="100%"
            height="450"
            style="border:none;"
            data-base-url="https://komutheme2.vercel.app/api/server"
            data-snippet-name="accordion"
            data-frame-id="pro-accordion"
            data-token="xyz789_pro_token"
            data-accent-color="22c55e"
            data-header-1="Is this secure?"
            data-content-1="Yes, all validation happens on the server."
        ></iframe>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            function constructSnippetUrl(iframe) {
                const baseUrl = iframe.dataset.baseUrl;
                const snippetName = iframe.dataset.snippetName;
                if (!baseUrl || !snippetName) return;

                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-')) {
                        const paramKey = attr.name.substring(5).replace(/-/g, '_');
                        const paramValue = encodeURIComponent(attr.value);
                        if (paramKey !== 'base_url' && paramKey !== 'snippet_name') {
                            params.push(`${paramKey}=${paramValue}`);
                        }
                    }
                }
                iframe.src = `${baseUrl}/${snippetName}?${params.join('&')}`;
            }
            document.querySelectorAll('iframe[data-base-url]').forEach(constructSnippetUrl);
        });
    </script>
</body>
</html>
