<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="controls">
    <input type="text" id="msg-input" placeholder="Type alert message...">
    <input type="color" id="accent-picker" value="#FF0000">
    <select id="type-select">
        <option value="success">Success</option>
        <option value="error">Error</option>
        <option value="info">Info</option>
    </select>
</div>

<iframe id="live-alert" src="https://.../alert.html?frame_id=live-alert" width="100%" style="border:none;"></iframe>

<script>
    const alertFrame = document.getElementById('live-alert');
    const inputs = {
        message: document.getElementById('msg-input'),
        accent_color: document.getElementById('accent-picker'),
        type: document.getElementById('type-select')
    };

    function broadcastUpdate() {
        const config = {
            message: inputs.message.value,
            // Strip the # from the color picker for your hex bridge
            accent_color: inputs.accent_color.value.replace('#', ''),
            type: inputs.type.value
        };

        // Send data into the iframe without reloading it!
        alertFrame.contentWindow.postMessage({
            type: 'THEMEX_UPDATE',
            config: config
        }, '*');
    }

    // Update whenever an input changes
    Object.values(inputs).forEach(el => el.addEventListener('input', broadcastUpdate));
</script>
</body>
</html>
