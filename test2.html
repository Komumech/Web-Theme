<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server-Side Rendering Test Page</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <style>
        body {
            margin: 0; 
            background: #f0f2f5;
            font-family: 'Poppins', sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            align-items: center;
        }
        .test-case {
            width: 100%;
            max-width: 400px;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1rem;
            background: #fff;
        }
        h3 {
            margin-top: 0;
            font-size: 1rem;
            color: #333;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }
    </style>
    
    <h2>Server-Side Rendering Snippet Tests</h2>

    <div class="test-case">
        <h3>1. Free User (gets default free plan)</h3>
        <iframe src="https://themes-blush-one.vercel.app/api/render/pricing-card?token=abc123_free_token&frame_id=free-card" width="100%" height="450" style="border:none;"></iframe>
    </div>
    <div class="test-case">
        <h3>2. Free User (tries to use `highlighted=true`, is denied)</h3>
        <iframe src="https://themes-blush-one.vercel.app/api/render/pricing-card?token=abc123_free_token&highlighted=true&frame_id=free-hack-card" width="100%" height="450" style="border:none;"></iframe>
    </div>
    <div class="test-case">
        <h3>3. Pro User (with full customizations)</h3>
        <iframe src="https://themes-blush-one.vercel.app/api/render/pricing-card?token=xyz789_pro_token&plan_name=Premium Pro&price=$299&interval=/yr&features=Advanced Analytics,Priority Support,5 Team Members,99.9% Uptime Guarantee&cta_text=Go Annual&primary_color=3b82f6&accent_color=ef4444&highlighted=true&frame_id=price-card-1" width="100%" height="450" style="border:none;"></iframe>
    </div>
    <div class="test-case">
        <h3>4. Pro User (Accordion with customizations)</h3>
        <iframe 
            src="https://themes-blush-one.vercel.app/api/render/accordion?token=xyz789_pro_token&frame_id=pro-accordion&accent_color=22c55e&header_1=Is this secure?&content_1=Yes, all validation happens on the server."
            width="100%" 
            height="450" 
            style="border:none;"
        ></iframe>
    </div>
</body>
</html>
