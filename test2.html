<script>
    /* 1. CRITICAL: Function to construct the URL from data- attributes 
         This is required for all snippets that use the `data-base-url` attribute.
    */
    function constructSnippetUrl() {
        document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
            if (!iframe.src) { // Only build if src is empty
                const baseUrl = iframe.getAttribute('data-base-url');
                const dataAttributes = Array.from(iframe.attributes)
                    .filter(attr => attr.name.startsWith('data-'))
                    .map(attr => {
                        // Convert data-frame-id to frame_id
                        const paramName = attr.name.substring(5).replace(/-/g, '_');
                        return `${paramName}=${encodeURIComponent(attr.value)}`;
                    })
                    .join('&');
                
                iframe.src = `${baseUrl}?${dataAttributes}`;
            }
        });
    }

    // Run the function immediately after the DOM is ready
    document.addEventListener('DOMContentLoaded', constructSnippetUrl);

    /*
      2. CRITICAL: PostMessage Listener for Dynamic Height Adjustment
         This is required for snippets like Accordion, Input, and Features 
         to resize the iframe height to match their content.
    */
    window.addEventListener('message', function(event) {
        // Only process messages from the expected origin for security (optional but recommended)
        // const allowedOrigin = 'https://themes-blush-one.vercel.app';
        // if (event.origin !== allowedOrigin) return;

        // Check for dynamic height message
        if (event.data && event.data.action === 'set_iframe_height' && event.data.frameId) {
            const iframe = document.getElementById(event.data.frameId);
            if (iframe) {
                // Set the height of the iframe
                iframe.style.height = `${event.data.height}px`;
                console.log(`Resized iframe ${event.data.frameId} to ${event.data.height}px`);
            }
        }
        
        // Check for form submission message (for the my-contact-input iframe)
        if (event.data && event.data.action === 'input_submitted' && event.data.frameId === 'my-contact-input') {
            const submittedValue = event.data.value;
            console.log("SUCCESS! Data received from iframe:", submittedValue);
            alert(`Parent page received input: ${submittedValue}. In a real app, you would send this to your server.`);
        }
    });
</script>

 <script>
    /**
     * Handles the PostMessage event to dynamically resize an iframe.
     * This code listens for messages from the components and adjusts the height
     * of the corresponding iframe on this page.
     */
    function handleDynamicIframeResize(event) {
      // OPTIONAL SECURITY CHECK: uncomment to restrict messages
      // if (event.origin !== "https://themes-blush-one.vercel.app") { return; }

      const data = event.data;

      // Ensure the message contains the height and ID
      if (data.frameHeight && data.frameId) {
        const iframe = document.getElementById(data.frameId);

        if (iframe) {
          // Set the iframe's height, adding a small buffer (+5px)
          iframe.style.height = (data.frameHeight + 5) + "px";
          // FIX: Ensure the iframe itself is explicitly told not to scroll
          iframe.style.overflow = 'hidden';
        }
      }
    }

    // Attach the handler to the window's message event
    window.addEventListener("message", handleDynamicIframeResize, false);
  </script>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // URL Construction Logic
      function constructSnippetUrl(iframe) {
        const baseUrl = iframe.getAttribute('data-base-url');
        if (!baseUrl) return;
        let params = [];
        for (const attr of iframe.attributes) {
          if (attr.name.startsWith('data-')) {
            const paramKey = attr.name.substring(5).replace(/-/g, '_');
            const paramValue = encodeURIComponent(attr.value);
            if (paramKey !== 'base_url') {
              params.push(`${paramKey}=${paramValue}`);
            }
          }
        }
        iframe.src = baseUrl + '?' + params.join('&');
      }
      document.querySelectorAll('iframe[data-base-url]').forEach(constructSnippetUrl);
    });
  </script>
