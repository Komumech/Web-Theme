    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap');

        body {
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding-bottom: 50px;
            font-family: 'Outfit', sans-serif;
            color: #1a1a1a;
        }
        
        h1 { margin-top: 2rem; font-weight: 700; }
        h2 { margin-top: 3rem; color: #666; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; }
        
        iframe {
            border: none;
            box-shadow: none;
            margin-bottom: 1rem;
            overflow: hidden;
            width: 100%; 
            transition: height 0.3s ease;
        }

        .controls {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .btn {
            padding: 8px 16px;
            background: #1a1a1a;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            font-family: 'Outfit', sans-serif;
            transition: transform 0.1s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-outline { background: transparent; border: 1px solid #1a1a1a; color: #1a1a1a; }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            width: 90vw;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>

    <script>
        // 1. DYNAMIC RESIZER
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        // 2. URL CONSTRUCTOR
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-')) {
                        let key = attr.name.substring(5).replace(/-/g, '_');
                        if (key === 'base_url') continue;
                        const value = encodeURIComponent(attr.value);
                        params.push(`${key}=${value}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&');
            });
        });
    </script>
