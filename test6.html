<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Theme Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf8f5;
            font-family: sans-serif;
        }
        
        .theme-wrapper {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }

        iframe {
            width: 100%;
            border: none;
            overflow: hidden;
            display: block;
        }
    </style>
</head>
<body>

    <div class="theme-wrapper">
        <!-- Navbar -->
        <iframe 
            id="nav-frame"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/light/navbar.html"
            data-frame-id="nav-frame"
            data-brand="TESORO"
            data-cta_text="Join the Waitlist"
            data-accent_color="ffc233"
            scrolling="no"
        ></iframe>

        <!-- Features Section -->
        <iframe 
            id="features-frame"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/light/features.html"
            data-frame-id="features-frame"
            scrolling="no"
        ></iframe>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-')) {
                        let key = attr.name.substring(5).replace(/-/g, '_');
                        if (key === 'base_url') continue;
                        params.push(`${key}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&');
            });
        });

        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });
    </script>
</body>
</html>
