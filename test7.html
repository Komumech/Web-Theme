<!DOCTYPE html>

    <title>Tide Theme Test</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: sans-serif;
            background-color: #f0f0f0;
        }
        
        .preview-container {
            width: 100%;
            min-height: 100vh;
            position: relative;
        }

        #tide-navbar {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
        }

        iframe {
            width: 100%;
            border: none;
            display: block;
        }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            z-index: 100;
            display: flex;
            gap: 10px;
        }

        button {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1px solid #ccc;
            cursor: pointer;
            background: #fff;
            font-weight: bold;
        }
    </style>
</head>

    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            const iframes = document.querySelectorAll('iframe[data-base-url]');
            iframes.forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-') && attr.name !== 'data-base-url' && attr.name !== 'data-frame-id') {
                        params.push(`${attr.name.substring(5)}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&') + '&frame_id=' + iframe.id;
            });
        });
    </script>
</body>
