<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThemeX Professional Alert</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #FF0000;
            --glass: rgba(255, 255, 255, 0.04);
            --muted: #000000;
            --radius: 12px;
            --bg-blur: 12px;
        }
        body {
            margin: 0;
            padding: 10px;
            font-family: 'Inter', sans-serif;
            background-color: transparent;
            overflow: hidden;
        }
        .alert-container {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-radius: var(--radius);
            font-size: 0.95rem;
            line-height: 1.5;
            backdrop-filter: blur(var(--bg-blur));
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--muted);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }
        
        /* The accent bar */
        .alert-container::before {
            content: "";
            position: absolute;
            left: 0;
            top: 20%;
            height: 60%;
            width: 4px;
            background: var(--accent);
            border-radius: 0 4px 4px 0;
        }

        .alert-icon {
            font-size: 1.25rem;
            margin-right: 16px;
            color: var(--accent);
            display: flex;
            align-items: center;
        }
        
        .alert-content {
            flex: 1;
            font-weight: 500;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .alert-container { padding: 12px 16px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<div class="alert-container" id="alert-box">
    <div class="alert-icon">
        <i id="alert-icon" class="fas fa-info-circle"></i>
    </div>
    <div class="alert-content" id="alert-message">
        Loading message...
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        const params = new URLSearchParams(window.location.search);
        const root = document.documentElement;

        /**
         * 1. THE BRIDGE - STYLES
         */
        const styleBridge = {
            'accent_color': '--accent',
            'glass_color':  '--glass',
            'muted_color':  '--muted',
            'radius':       '--radius'
        };

        Object.keys(styleBridge).forEach(key => {
            const val = params.get(key);
            if (val) {
                let finalValue = val;
                // Hex check
                if (/^[0-9A-Fa-f]{3,8}$/.test(val)) finalValue = `#${val}`;
                // Unit check
                if (key === 'radius' && !isNaN(val)) finalValue += 'px';
                
                root.style.setProperty(styleBridge[key], finalValue);
            }
        });

        /**
         * 2. CONTENT & ICON LOGIC
         */
        const type = params.get("type") || "info";
        const message = params.get("message") || "Default alert message.";
        document.getElementById("alert-message").textContent = decodeURIComponent(message);

        const icons = {
            success: "fas fa-check-circle",
            error: "fas fa-exclamation-circle",
            warning: "fas fa-triangle-exclamation",
            info: "fas fa-circle-info"
        };
        document.getElementById("alert-icon").className = icons[type] || icons.info;

        /**
         * 3. DYNAMIC RESIZING
         */
        function sendHeight() {
            const frameId = params.get('frame_id');
            if (frameId && window.parent) {
                const height = document.body.scrollHeight;
                window.parent.postMessage({ frameId, frameHeight: height }, '*');
            }
        }

        sendHeight();
        window.addEventListener('resize', sendHeight);
        // Backup resize for font loading
        setTimeout(sendHeight, 500);
    });
</script>

</body>
</html>
