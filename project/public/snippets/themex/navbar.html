<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThemeX Navbar</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00b894;
            --muted: #9aa4b2;
            --navbar-bg: #cbede5;
            --logo-color: #ffffff;
            --link-color: #FFFFFF;
            --link-hover-color: #911bb5;
            --logo-width: auto;
            --logo-height: 32px;
        }
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color-scheme: dark;
            overflow: hidden;
        }
        .site-header {
            backdrop-filter: blur(6px);
            background: var(--navbar-bg);
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .header-inner {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 18px 24px;
            width: 100%;
            box-sizing: border-box;
        }
        .brand .logo {
            display: flex;
            align-items: center;
            font-weight: 800;
            letter-spacing: 0.6px;
            color: var(--logo-color);
            text-decoration: none;
            font-size: 1.1rem;
        }
        .brand .logo img {
            width: var(--logo-width);
            height: var(--logo-height);
            object-fit: contain;
            display: block;
        }
        .main-nav {
            display: flex;
            gap: 18px;
            margin-left: 24px;
            flex: 1;
        }
        .main-nav a {
            color: var(--link-color);
            text-decoration: none;
            font-weight: 500;
            transition: color .15s;
        }
        .main-nav a:hover { color: var(--link-hover-color)}
        .header-cta .btn {
            white-space: nowrap;
            display: inline-flex;
            padding: 8px 14px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            transition: all 0.2s ease;
        }
    </style>
</head>
<body>

<header class="site-header" id="navbar-root">
    <div class="header-inner">
        <div class="brand">
            <a href="#" class="logo" id="brand-logo">
                <span id="logo-text">ThemeX</span>
            </a>
        </div>
        <nav class="main-nav" id="main-nav-links"></nav>
        <div class="header-cta">
            <a href="#" class="btn" id="header-cta">Get Started</a>
        </div>
    </div>
</header>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const root = document.documentElement;

        /**
         * 1. THE BRIDGE - STYLES
         */
        const styleBridge = {
            'accent_color': '--accent',
            'navbar_color': '--navbar-bg',
            'logo_color':   '--logo-color',
            'link_color':   '--link-color',
            'hover_color':  '--link-hover-color',
            'logo_w':       '--logo-width',
            'logo_h':       '--logo-height'
        };

        Object.keys(styleBridge).forEach(key => {
            const value = params.get(key);
            if (value) {
                const cssVar = styleBridge[key];
                let finalValue = value;
                // Hex check
                if (/^[0-9A-Fa-f]{3,8}$/.test(value)) finalValue = `#${value}`;
                // Pixel check for dimensions
                if (['logo_w', 'logo_h'].includes(key) && !isNaN(value)) finalValue += 'px';
                
                root.style.setProperty(cssVar, finalValue);
            }
        });

        /**
         * 2. LOGO LOGIC (Image vs Text)
         */
        const logoContainer = document.getElementById('brand-logo');
        const logoImgUrl = params.get('logo_img');
        
        if (logoImgUrl) {
            // Replace text with image
            logoContainer.innerHTML = `<img src="${logoImgUrl}" alt="Logo">`;
        } else {
            // Use provided text or default
            document.getElementById('logo-text').textContent = params.get('brand_text') || 'ThemeX';
        }
        logoContainer.href = params.get('brand_href') || '#';

        /**
         * 3. CONTENT & LINKS
         */
        document.getElementById('header-cta').textContent = params.get('cta_text') || 'Get Started';
        document.getElementById('header-cta').href = params.get('cta_href') || '#';

        const navContainer = document.getElementById('main-nav-links');
        let navHtml = '';
        for (let i = 1; i <= 5; i++) {
            const label = params.get(`nav_link${i}_label`);
            const href = params.get(`nav_link${i}_href`);
            if (label) navHtml += `<a href="${href || '#'}">${label}</a>`;
        }
        navContainer.innerHTML = navHtml || `<a href="#">Home</a><a href="#">About</a><a href="#">Contact</a>`;

        /**
         * 4. RESIZING
         */
        function sendHeight() {
            const frameId = params.get('frame_id');
            if (frameId && window.parent) {
                const height = document.getElementById('navbar-root').offsetHeight;
                window.parent.postMessage({ frameId: frameId, frameHeight: height }, '*');
            }
        }
        sendHeight();
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    });
</script>
</body>
</html>
