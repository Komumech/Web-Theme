<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 40px 20px; font-family: 'Lato', sans-serif; overflow: hidden; }
        .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 40px; max-width: 1100px; margin: 0 auto 40px auto; }
        h2 { font-family: 'Playfair Display', serif; font-size: 42px; font-style: italic; margin: 0; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .item { position: relative; }
        .img-box { width: 100%; height: 300px; overflow: hidden; margin-bottom: 15px; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s; }
        .item:hover img { transform: scale(1.05); }
        h3 { font-family: 'Playfair Display', serif; font-size: 24px; margin: 0 0 5px 0; }
        p { margin: 0; opacity: 0.7; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="heading">Our menu</h2>
    </div>
    <div class="grid" id="grid">
        <!-- Items injected via JS -->
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('heading')) document.getElementById('heading').textContent = params.get('heading');
        
        const grid = document.getElementById('grid');
        let i = 1;
        while(params.has(`item${i}_title`)) {
            const div = document.createElement('div');
            div.className = 'item';
            div.innerHTML = `
                <div class="img-box"><img src="${params.get(`item${i}_img`)}" alt="Item"></div>
                <h3>${params.get(`item${i}_title`)}</h3>
                <p>${params.get(`item${i}_desc`)}</p>
            `;
            grid.appendChild(div);
            i++;
        }
        
        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
