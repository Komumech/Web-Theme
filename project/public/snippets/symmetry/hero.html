<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Hero</title>
    <base target="_blank">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400;1,600&family=Manrope:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 40px 20px; font-family: 'Manrope', sans-serif; overflow: hidden; box-sizing: border-box; }
        
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            perspective: 1000px;
        }

        .polaroid-frame {
            background-color: #ffffff;
            padding: 15px 15px 60px 15px; /* Thicker bottom like a polaroid */
            box-shadow: 0 20px 50px rgba(0,0,0,0.15);
            transform: rotate(-2deg);
            transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            position: relative;
        }
        .polaroid-frame:hover { transform: rotate(0deg) scale(1.01); }

        .image-area {
            position: relative;
            width: 100%;
            height: 600px;
            overflow: hidden;
            background-color: #333;
        }

        .slide-image {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 8s ease, opacity 1s ease;
            opacity: 0;
        }
        .polaroid-frame:hover .slide-image { transform: scale(1.1); }
        .slide-image.active { opacity: 1; }

        .overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.2); /* Slight dim */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 30px;
            box-sizing: border-box;
        }

        /* Top Bar inside Hero */
        .top-bar { display: flex; justify-content: space-between; align-items: flex-start; }
        .brand {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 28px;
            color: white;
            text-decoration: none;
        }
        .controls { display: flex; gap: 15px; align-items: center; }
        .menu-btn {
            width: 40px; height: 40px; border: 1px solid rgba(255,255,255,0.6); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; color: white; cursor: pointer;
            transition: 0.3s;
        }
        .menu-btn:hover { background: white; color: black; }
        .cta-btn {
            padding: 10px 24px; border: 1px solid rgba(255,255,255,0.6); border-radius: 50px;
            color: white; text-decoration: none; font-size: 14px; text-transform: uppercase; letter-spacing: 1px;
            transition: 0.3s;
        }
        .cta-btn:hover { background: white; color: black; }

        /* Center Content */
        .center-content { text-align: center; color: white; margin-bottom: 40px; }
        .title {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 90px;
            margin: 0 0 10px 0;
            line-height: 1;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
        }
        .subtitle {
            font-size: 16px;
            max-width: 400px;
            margin: 0 auto;
            line-height: 1.5;
            opacity: 0.9;
        }

        /* Bottom Indicators */
        .indicators { display: flex; gap: 10px; justify-content: center; }
        .dash { width: 40px; height: 3px; background: rgba(255,255,255,0.4); border-radius: 2px; }
        .dash.active { background: white; }

        /* Mobile Menu Overlay */
        .nav-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(5px);
        }
        .nav-overlay.active { opacity: 1; pointer-events: all; }
        .nav-links-container a {
            display: block;
            color: white;
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            text-decoration: none;
            margin: 15px 0;
            font-style: italic;
            text-align: center;
            transition: color 0.3s;
        }
        .nav-links-container a:hover { color: #ccc; }
        .close-btn {
            position: absolute; top: 20px; right: 20px;
            color: white; font-size: 36px; cursor: pointer; line-height: 1;
        }

        @media (max-width: 768px) {
            .polaroid-frame { transform: rotate(0deg); padding: 10px 10px 40px 10px; }
            .image-area { height: 500px; }
            .title { font-size: 56px; }
            .brand { font-size: 24px; }
            .cta-btn { padding: 8px 16px; font-size: 12px; }
        }
        @media (max-width: 480px) {
            .title { font-size: 42px; }
            .image-area { height: 450px; }
            .nav-links-container a { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="polaroid-frame" id="frame">
            <div class="image-area">
                <div id="slideshow-container"></div>
                <div class="overlay">
                    <div class="top-bar">
                        <span class="brand" id="brand">Brand</span>
                        <div class="controls">
                            <div class="menu-btn" onclick="toggleMenu()">☰</div>
                            <a href="#" class="cta-btn" id="cta">Action</a>
                        </div>
                    </div>
                    <div class="center-content">
                        <h1 class="title" id="title">Title</h1>
                        <p class="subtitle" id="subtitle">Subtitle</p>
                    </div>
                    <div class="indicators">
                        <div class="dash active"></div><div class="dash"></div><div class="dash"></div>
                    </div>
                    
                    <!-- Menu Overlay -->
                    <div class="nav-overlay" id="nav-overlay">
                        <div class="close-btn" onclick="toggleMenu()">×</div>
                        <div class="nav-links-container" id="nav-links"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Colors
        if(params.get('bg_color')) document.getElementById('frame').style.backgroundColor = '#' + params.get('bg_color');
        if(params.get('text_color')) {
            const color = '#' + params.get('text_color');
            document.getElementById('brand').style.color = color;
            document.getElementById('title').style.color = color;
            document.getElementById('subtitle').style.color = color;
            document.querySelector('.menu-btn').style.borderColor = color;
            document.querySelector('.menu-btn').style.color = color;
            document.getElementById('cta').style.borderColor = color;
            document.getElementById('cta').style.color = color;
        }

        // Content
        const imagesParam = params.get('images') || params.get('image') || 'https://images.unsplash.com/photo-1559339352-11d035aa65de?auto=format&fit=crop&w=1200&q=80';
        const images = imagesParam.split(',');
        const slideContainer = document.getElementById('slideshow-container');
        
        images.forEach((src, index) => {
            const img = document.createElement('img');
            img.src = src.trim();
            img.className = `slide-image ${index === 0 ? 'active' : ''}`;
            slideContainer.appendChild(img);
        });

        // Slideshow Logic
        if (images.length > 1) {
            let currentSlide = 0;
            setInterval(() => {
                const slides = document.querySelectorAll('.slide-image');
                slides[currentSlide].classList.remove('active');
                currentSlide = (currentSlide + 1) % slides.length;
                slides[currentSlide].classList.add('active');
            }, 4000); // Change slide every 4 seconds
        }

        document.getElementById('brand').textContent = params.get('brand') || 'Coral Cove';
        document.getElementById('title').textContent = params.get('title') || 'Coral Cove';
        document.getElementById('subtitle').textContent = params.get('subtitle') || 'Restaurant of bold culinary solutions.';
        document.getElementById('cta').textContent = params.get('cta_text') || 'Reservation';
        document.getElementById('cta').href = params.get('cta_href') || '#';

        // Menu Logic
        function toggleMenu() {
            document.getElementById('nav-overlay').classList.toggle('active');
        }

        const navContainer = document.getElementById('nav-links');
        const linksParam = params.get('nav_links') || 'Home|#,Menu|#,About|#,Contact|#';
        linksParam.split(',').forEach(item => {
            const [text, href] = item.split('|');
            const a = document.createElement('a');
            a.textContent = text;
            a.href = href || '#';
            navContainer.appendChild(a);
        });

        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
