<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coral Hero</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 40px; font-family: sans-serif; overflow: hidden; box-sizing: border-box; }
        .hero-container {
            position: relative;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            transform: rotate(-2deg);
            transition: transform 0.5s ease;
        }
        .hero-container:hover { transform: rotate(0deg); }
        
        .frame {
            background: white;
            padding: 15px 15px 60px 15px; /* Polaroid style bottom padding */
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .img-wrapper {
            position: relative;
            width: 100%;
            height: 550px;
            overflow: hidden;
            background: #eee;
        }
        
        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .overlay-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'Playfair Display', serif;
            font-size: 90px;
            color: white;
            font-style: italic;
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            white-space: nowrap;
            text-align: center;
            width: 100%;
        }
        
        .sub-text {
            font-size: 16px;
            font-family: sans-serif;
            margin-top: 10px;
            font-style: normal;
            font-weight: 400;
            letter-spacing: 1px;
            text-shadow: 0 1px 5px rgba(0,0,0,0.5);
        }

        @media (max-width: 768px) {
            .hero-container { transform: rotate(0deg); }
            .overlay-text { font-size: 48px; }
            .img-wrapper { height: 350px; }
        }
    </style>
</head>
<body>
    <div class="hero-container">
        <div class="frame">
            <div class="img-wrapper">
                <img id="bg-img" src="" alt="Hero">
                <div class="overlay-text">
                    <span id="title">Coral Cove</span>
                    <div class="sub-text" id="subtitle">Restaurant of bold culinary solutions.</div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('image')) document.getElementById('bg-img').src = params.get('image');
        if(params.get('title')) document.getElementById('title').textContent = params.get('title');
        if(params.get('subtitle')) document.getElementById('subtitle').textContent = params.get('subtitle');
        
        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
