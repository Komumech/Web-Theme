<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symmetry Features</title>
    <base target="_blank">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Manrope:wght@300;400&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 60px 20px; font-family: 'Manrope', sans-serif; overflow: hidden; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 40px;
            max-width: 1200px;
            margin: 0 auto;
            text-align: center;
        }
        .icon { font-size: 32px; margin-bottom: 20px; display: block; }
        h3 { font-family: 'Playfair Display', serif; font-size: 24px; font-style: italic; margin: 0 0 15px 0; color: #1a1a1a; }
        p { font-size: 15px; line-height: 1.6; opacity: 0.8; margin: 0; color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="grid" id="grid"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        
        if(params.get('bg_color')) document.body.style.backgroundColor = '#' + params.get('bg_color');
        const textColor = params.get('text_color') ? '#' + params.get('text_color') : '#1a1a1a';

        const grid = document.getElementById('grid');
        let i = 1;
        while(params.has(`title${i}`)) {
            const div = document.createElement('div');
            div.innerHTML = `
                <span class="icon" style="color: ${textColor}">${params.get(`icon${i}`) || '✦'}</span>
                <h3 style="color: ${textColor}">${params.get(`title${i}`)}</h3>
                <p style="color: ${textColor}">${params.get(`desc${i}`)}</p>
            `;
            grid.appendChild(div);
            i++;
        }
        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
    </script>
</body>
</html>
