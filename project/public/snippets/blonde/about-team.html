<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blond Team</title>
    <base target="_blank">
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #1a1a1a;
            --heading-color: #1a1a1a;
        }
        body { margin: 0; padding: 60px 20px; font-family: 'Manrope', sans-serif; background: var(--bg-color); color: var(--text-color); }
        .header { text-align: center; max-width: 800px; margin: 0 auto 50px auto; }
        h2 { font-size: 36px; font-weight: 800; margin: 0 0 15px 0; color: var(--heading-color); }
        p { font-size: 18px; opacity: 0.7; margin: 0; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 40px; max-width: 1200px; margin: 0 auto; }
        .member { text-align: center; }
        .img-wrapper { width: 150px; height: 150px; border-radius: 50%; overflow: hidden; margin: 0 auto 20px auto; background: #eee; }
        .img-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        h3 { font-size: 20px; font-weight: 800; margin: 0 0 5px 0; color: var(--heading-color); }
        .role { font-size: 14px; opacity: 0.6; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin: 0; }
    </style>
</head>
<body>
    <div class="header">
        <h2 id="label">Our Team</h2>
        <p id="description">Meet the experts.</p>
    </div>
    <div class="grid" id="grid"></div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.has('bg_color')) document.documentElement.style.setProperty('--bg-color', '#' + params.get('bg_color'));
        if(params.has('text_color')) document.documentElement.style.setProperty('--text-color', '#' + params.get('text_color'));
        if(params.has('heading_color')) document.documentElement.style.setProperty('--heading-color', '#' + params.get('heading_color'));

        if(params.get('label')) document.getElementById('label').textContent = params.get('label');
        if(params.get('description')) document.getElementById('description').textContent = params.get('description');

        const grid = document.getElementById('grid');
        let i = 1;
        while(params.has(`member${i}_name`)) {
            const div = document.createElement('div');
            div.className = 'member';
            div.innerHTML = `
                <div class="img-wrapper"><img src="${params.get(`member${i}_img`)}" alt="${params.get(`member${i}_name`)}"></div>
                <h3>${params.get(`member${i}_name`)}</h3>
                <p class="role">${params.get(`member${i}_role`)}</p>
            `;
            grid.appendChild(div);
            i++;
        }
        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
    </script>
</body>
</html>
