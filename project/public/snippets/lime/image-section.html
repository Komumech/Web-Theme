<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lime Image Section</title>
    <base target="_blank">
    <style>
        body { margin: 0; padding: 20px; font-family: sans-serif; overflow: hidden; box-sizing: border-box; }
        .container {
            width: 100%;
            height: 400px;
            border-radius: 30px;
            background-size: cover;
            background-position: center;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(6, 78, 59, 0.6); /* Green tint */
        }
        .content { position: relative; z-index: 1; padding: 20px; max-width: 800px; }
        h2 { font-size: 48px; font-weight: 800; margin: 0 0 20px 0; text-transform: uppercase; }
        p { font-size: 20px; font-weight: 500; margin: 0; }
        
        @media (max-width: 600px) { h2 { font-size: 32px; } }
    </style>
</head>
<body>
    <div class="container" id="bg">
        <div class="overlay" id="overlay"></div>
        <div class="content">
            <h2 id="heading">Heading</h2>
            <p id="subheading">Subheading</p>
        </div>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('bg_image')) document.getElementById('bg').style.backgroundImage = `url('${params.get('bg_image')}')`;
        if(params.get('heading')) document.getElementById('heading').textContent = params.get('heading');
        if(params.get('subheading')) document.getElementById('subheading').textContent = params.get('subheading');
        const sendHeight = () => { if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*'); }
        window.addEventListener('load', sendHeight);
    </script>
</body>
</html>
