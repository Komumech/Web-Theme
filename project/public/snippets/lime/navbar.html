<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Navbar</title>
    <base target="_blank">
    <style>
        :root {
            --primary-bg: #ea4c3b;
            --text-color: #ffffff;
        }
        html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
        body { 
            font-family: sans-serif; 
            background: transparent; 
            display: flex;
            justify-content: flex-start; /* Aligned Left */
            align-items: flex-end;
            padding: 15px;
            box-sizing: border-box;
        }

        .nav-pill {
            background: var(--primary-bg);
            border-radius: 50px;
            padding: 8px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-width: fit-content;
            transition: all 0.3s ease;
        }

        .home-btn {
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            margin-right: 5px;
        }
        .home-btn svg { width: 20px; height: 20px; fill: white; }

        /* Desktop Nav Items */
        .nav-items-container {
            display: flex;
            align-items: center;
        }

        .nav-item {
            padding: 10px 16px;
            color: var(--text-color);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            border-radius: 30px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-item:hover { background: rgba(255,255,255,0.1); }

        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding: 10px;
            cursor: pointer;
            border-radius: 50%;
        }
        .hamburger span {
            width: 20px;
            height: 2px;
            background: white;
            transition: 0.3s;
        }

        /* Mobile View Styles */
        @media (max-width: 768px) {
            .nav-items-container { display: none; } /* Hide regular links */
            .hamburger { display: flex; } /* Show hamburger */
            
            .nav-pill.mobile-open {
                border-radius: 20px;
                flex-direction: column;
                align-items: flex-start;
                padding: 15px;
            }

            .mobile-menu {
                display: none;
                flex-direction: column;
                width: 100%;
                margin-top: 10px;
                gap: 5px;
            }
            .nav-pill.mobile-open .mobile-menu { display: flex; }
            .mobile-link {
                color: white;
                text-decoration: none;
                padding: 12px;
                border-radius: 10px;
                background: rgba(255,255,255,0.1);
                font-weight: 600;
            }
        }

        /* Dropdown Styles (Desktop) */
        .nav-group { position: relative; }
        .dropdown-menu {
            position: absolute;
            bottom: 140%;
            left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: white;
            min-width: 160px;
            border-radius: 12px;
            padding: 8px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
            display: none;
            flex-direction: column;
            gap: 4px;
            opacity: 0;
            transition: 0.2s;
        }
        .dropdown-menu.show { display: flex; opacity: 1; transform: translateX(-50%) translateY(0); }
        .dropdown-link {
            padding: 10px;
            color: #333;
            text-decoration: none;
            font-size: 14px;
            border-radius: 8px;
        }
        .dropdown-link:hover { background: #f5f5f5; color: var(--primary-bg); }
        
        .arrow { font-size: 10px; transition: 0.3s; }
        .arrow.open { transform: rotate(180deg); }
    </style>
</head>
<body>
    <div class="nav-pill" id="nav-pill">
        <div class="home-btn" id="home-btn">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </div>

        <div class="nav-items-container" id="desktop-links"></div>

        <div class="hamburger" id="hamburger">
            <span></span>
            <span></span>
            <span></span>
        </div>

        <div class="mobile-menu" id="mobile-links"></div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Colors
        const bgColor = params.get('bg_color') ? '#' + params.get('bg_color') : '#ea4c3b';
        const textColor = params.get('text_color') ? '#' + params.get('text_color') : '#ffffff';
        document.documentElement.style.setProperty('--primary-bg', bgColor);
        document.documentElement.style.setProperty('--text-color', textColor);

        const desktopContainer = document.getElementById('desktop-links');
        const mobileContainer = document.getElementById('mobile-links');
        const navPill = document.getElementById('nav-pill');
        const hamburger = document.getElementById('hamburger');

        // Home Link
        if(params.get('home_href')) {
            document.getElementById('home-btn').onclick = () => window.open(params.get('home_href'), '_blank');
        }

        // Generate Links
        ['link1', 'link2', 'link3'].forEach(key => {
            const text = params.get(key + '_text');
            const href = params.get(key + '_href') || '#';
            const items = params.get(key + '_items');

            if (text) {
                // Create Desktop Element
                const group = document.createElement('div');
                group.className = 'nav-group';
                let arrow = items ? ' <span class="arrow">▼</span>' : '';
                group.innerHTML = `<a href="${href}" class="nav-item">${text}${arrow}</a>`;
                
                if (items) {
                    const dd = document.createElement('div');
                    dd.className = 'dropdown-menu';
                    items.split(',').forEach(item => {
                        const [l, h] = item.split('|');
                        dd.innerHTML += `<a href="${h || '#'}" class="dropdown-link">${l}</a>`;
                    });
                    group.appendChild(dd);
                    group.onclick = (e) => {
                        e.preventDefault();
                        dd.classList.toggle('show');
                        group.querySelector('.arrow').classList.toggle('open');
                        sendHeight(dd.classList.contains('show') ? 300 : 100);
                    };
                }
                desktopContainer.appendChild(group);

                // Create Mobile Element
                const mLink = document.createElement('a');
                mLink.className = 'mobile-link';
                mLink.href = href;
                mLink.textContent = text;
                mobileContainer.appendChild(mLink);
            }
        });

        // Mobile Toggle logic
        hamburger.onclick = () => {
            navPill.classList.toggle('mobile-open');
            const isOpen = navPill.classList.contains('mobile-open');
            sendHeight(isOpen ? 400 : 100);
        };

        function sendHeight(h) {
            const frameId = params.get('frame_id');
            if(frameId) {
                window.parent.postMessage({ frameHeight: h, frameId: frameId }, '*');
            }
        }

        // Initial height
        window.onload = () => sendHeight(100);
    </script>
</body>
</html>
