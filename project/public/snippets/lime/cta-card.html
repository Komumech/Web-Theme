<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integra CTA Card</title>
    <style>
        body { margin: 0; padding: 20px; font-family: 'Manrope', sans-serif; overflow: hidden; box-sizing: border-box; }
        .card {
            background-color: #064e3b;
            border-radius: 30px;
            padding: 50px 30px;
            text-align: center;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 500px;
            margin: 0 auto;
            position: relative;
        }
        
        .illustration {
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 30px;
        }
        
        .illustration svg {
            width: 160px;
            height: auto;
            filter: drop-shadow(0 8px 12px rgba(0,0,0,0.15));
        }

        .heading { font-size: 32px; font-weight: 800; margin: 0 0 15px 0; text-transform: uppercase; }
        .description { font-size: 16px; line-height: 1.5; margin: 0 0 30px 0; opacity: 0.9; }

        .btn {
            text-decoration: none;
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="illustration">
            <svg viewBox="0 0 200 200" id="icon-svg">
                <g id="icon-handshake" style="display:none;">
                    <path d="M40 110 L60 90 C 70 80, 85 80, 95 90 L115 110 L140 85 C 150 75, 165 75, 175 85 L190 100" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <path d="M10 140 L40 110 L70 140 L50 160 L20 160 Z" fill="white" opacity="0.2"/>
                    <path d="M85 115 C 75 125, 75 140, 85 150 L115 180 M115 115 C 125 125, 125 140, 115 150 L85 180" fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
                    <path d="M70 125 Q 100 95 130 125 M75 140 Q 100 110 125 140 M80 155 Q 100 130 120 155" fill="none" stroke="white" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
                </g>

                <g id="icon-coin" style="display:none;">
                    <ellipse cx="100" cy="150" rx="60" ry="25" fill="white" opacity="0.3" stroke="white" stroke-width="3"/>
                    <ellipse cx="100" cy="125" rx="60" ry="25" fill="white" opacity="0.6" stroke="white" stroke-width="3"/>
                    <g transform="translate(0, -10)">
                        <ellipse cx="100" cy="100" rx="60" ry="25" fill="white" stroke="white" stroke-width="4"/>
                        <ellipse cx="100" cy="100" rx="45" ry="18" fill="none" stroke="black" stroke-width="2" stroke-dasharray="4 4" opacity="0.3"/>
                        <text x="100" y="112" font-family="Arial" font-size="35" font-weight="900" text-anchor="middle" fill="black">$</text>
                    </g>
                </g>
            </svg>
        </div>
        
        <h2 class="heading" id="heading">TITLE</h2>
        <p class="description" id="desc">Description text.</p>
        <a href="#" class="btn" id="btn">CTA</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        // Colors
        const bgColor = params.get('bg_color') ? '#' + params.get('bg_color') : '#0768b3';
        const textColor = params.get('text_color') ? '#' + params.get('text_color') : '#ffffff';
        const btnBg = params.get('btn_bg') ? '#' + params.get('btn_bg') : '#00c060';
        const btnTextColor = params.get('btn_text_color') ? '#' + params.get('btn_text_color') : '#ffffff';

        document.getElementById('card').style.backgroundColor = bgColor;
        document.getElementById('card').style.color = textColor;
        const btn = document.getElementById('btn');
        btn.style.backgroundColor = btnBg;
        btn.style.color = btnTextColor;

        // Content
        document.getElementById('heading').textContent = params.get('heading') || 'STAY UP TO DATE';
        document.getElementById('desc').textContent = params.get('description') || 'Join Integra Co-op today.';
        btn.textContent = params.get('cta_text') || 'Subscribe';
        btn.href = params.get('cta_href') || '#';

        // Icon Logic
        const iconType = params.get('icon') || 'handshake';
        const targetIcon = document.getElementById('icon-' + iconType);
        if(targetIcon) targetIcon.style.display = 'block';

        // Auto-Height for Parent
        function sendHeight() {
            const height = document.body.scrollHeight;
            const frameId = params.get('frame_id');
            if(frameId) window.parent.postMessage({ frameHeight: height, frameId: frameId }, '*');
        }
        window.onload = sendHeight;
        window.onresize = sendHeight;
    </script>
</body>
</html>
