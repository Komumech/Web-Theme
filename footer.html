<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dawn Footer</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap');
        :root { 
            --bg-color: #111111; 
            --text-color: #ffffff; 
            --accent-color: #7c3aed; 
            --muted-color: #888888;
            --border-color: rgba(255,255,255,0.1);
            --font-head: 'Playfair Display', serif; 
            --font-body: 'Inter', sans-serif; 
        }
        body { 
            margin: 0; 
            font-family: var(--font-body); 
            background: var(--bg-color); 
            color: var(--text-color); 
            padding: 5rem 3rem 2rem; 
            overflow: hidden; 
        }

        /* Top CTA Section */
        .footer-cta {
            margin-bottom: 4rem;
            padding-bottom: 4rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 2rem;
        }
        .footer-cta h2 {
            font-family: var(--font-head);
            font-size: 3.5rem;
            margin: 0;
            line-height: 1.1;
            max-width: 600px;
        }
        .footer-cta .btn {
            background: var(--text-color);
            color: var(--bg-color);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 500;
            transition: transform 0.2s, background 0.2s;
        }
        .footer-cta .btn:hover {
            transform: translateY(-2px);
            background: var(--accent-color);
            color: white;
        }

        .footer-content { 
            display: grid; 
            grid-template-columns: 2fr 1fr 1fr 1.5fr; 
            gap: 3rem; 
            margin-bottom: 4rem; 
        }
        .col { min-width: 0; }
        
        /* Brand Column */
        h4#company { 
            font-family: var(--font-head); 
            font-size: 1.8rem; 
            margin: 0 0 1rem; 
            font-weight: 400; 
            letter-spacing: -0.02em;
        }
        p#desc { 
            font-size: 0.95rem; 
            color: var(--muted-color); 
            line-height: 1.6; 
            max-width: 280px; 
        }

        /* Headings for Links */
        .col h5 { 
            font-size: 0.9rem; 
            color: var(--text-color); 
            margin: 0 0 1.5rem 0; 
            font-weight: 500; 
        }

        /* Links */
        a { 
            font-size: 0.9rem; 
            color: var(--muted-color); 
            text-decoration: none; 
            display: block; 
            margin-bottom: 0.8rem; 
            transition: all 0.2s ease; 
            width: fit-content;
        }
        a:hover { 
            color: var(--accent-color); 
            transform: translateX(4px); 
        }

        /* Newsletter Input */
        .newsletter-input {
            display: flex;
            border-bottom: 1px solid var(--muted-color);
            padding-bottom: 0.5rem;
            margin-top: 1rem;
        }
        .newsletter-input input {
            background: transparent;
            border: none;
            color: white;
            flex: 1;
            outline: none;
            font-family: var(--font-body);
        }
        .newsletter-input button {
            background: none;
            border: none;
            color: var(--accent-color);
            cursor: pointer;
            font-size: 1.2rem;
        }

        .copyright { 
            font-size: 0.8rem; 
            color: var(--muted-color); 
            border-top: 1px solid var(--border-color); 
            padding-top: 2rem; 
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (max-width: 768px) {
            body { padding: 3rem 1.5rem 2rem; }
            .footer-cta h2 { font-size: 2.5rem; }
            .footer-content { grid-template-columns: 1fr; gap: 2.5rem; }
            .copyright { flex-direction: column; gap: 1rem; }
        }
    </style>
</head>
<body>
    <div class="footer-cta">
        <h2>Let's build something meaningful together.</h2>
        <a href="#" class="btn">Start a Project</a>
    </div>

    <div class="footer-content">
        <div class="col">
            <h4 id="company">Dawn.</h4>
            <p id="desc">Elegant digital solutions.</p>
        </div>
        <div class="col">
            <h5>Explore</h5>
            <div id="links"></div>
        </div>
        <div class="col">
            <h5>Connect</h5>
            <div id="social"></div>
        </div>
        <div class="col">
            <h5>Newsletter</h5>
            <p style="font-size: 0.9rem; color: var(--muted-color); margin-bottom: 1rem;">Latest updates in your inbox.</p>
            <div class="newsletter-input">
                <input type="email" placeholder="Email address">
                <button>→</button>
            </div>
        </div>
    </div>
    <div class="copyright">
        <span id="copy">&copy; 2025 Dawn Theme.</span>
        <span>Designed with care.</span>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        if(params.get('company_name')) document.getElementById('company').textContent = params.get('company_name');
        if(params.get('description')) document.getElementById('desc').textContent = params.get('description');
        if(params.get('copyright')) document.getElementById('copy').innerHTML = params.get('copyright');
        if(params.get('accent_color')) document.documentElement.style.setProperty('--accent-color', '#'+params.get('accent_color'));
        
        const linksDiv = document.getElementById('links');
        for(let i=1; i<=4; i++) {
            if(params.get(`link${i}_label`)) {
                const a = document.createElement('a');
                a.href = params.get(`link${i}_href`) || '#';
                a.textContent = params.get(`link${i}_label`);
                linksDiv.appendChild(a);
            }
        }

        const socialDiv = document.getElementById('social');
        for(let i=1; i<=4; i++) {
            if(params.get(`social${i}_label`)) {
                const a = document.createElement('a');
                a.href = params.get(`social${i}_href`) || '#';
                a.textContent = params.get(`social${i}_label`);
                socialDiv.appendChild(a);
            }
        }
        
        const sendHeight = () => {
            if(params.get('frame_id')) window.parent.postMessage({frameId: params.get('frame_id'), frameHeight: document.body.scrollHeight}, '*');
        }
        window.addEventListener('load', sendHeight);
        window.addEventListener('resize', sendHeight);
    </script>
</body>
</html>
