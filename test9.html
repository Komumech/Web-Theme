<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blond Theme Test (Test 9)</title>
    <style>
        body { margin: 0; padding: 0; background: #f5f5f5; font-family: sans-serif; }
        .preview { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; }
        iframe { width: 100%; border: none; display: block; overflow: hidden; }
    </style>
</head>
<body>
    <div class="preview">
        <iframe 
            id="blond-nav"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/blonde/navbar.html"
            data-frame-id="blond-nav"
            data-brand="Kalogirou Rania"
            data-link1_text="Home"
            data-link2_text="Pages"
            data-link3_text="Blog"
            data-link4_text="Portfolio"
            data-cta_text="Let's work!"
        ></iframe>

        <iframe 
            id="blond-hero"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets/blonde/hero.html"
            data-frame-id="blond-hero"
            data-headline="Looking for help with your"
            data-keywords="content?,copy?,strategy?,marketing?"
            data-prob_title="The Problem"
            data-prob_desc="You know what compelling, human-like copy sounds like. But when it comes to writing it, that is a different topic altogether."
            data-sol_title="The Solution"
            data-sol_desc="This is where a content copywriter can come in handy. And this is why you are here."
            data-typing_speed="150"
            data-delete_speed="100"
            data-pause_time="2000"
        ></iframe>

        <iframe 
            id="blond-intro"
            src=""
            data-base-url="snippets/blond/intro-card.html"
            data-frame-id="blond-intro"
            data-eyebrow="Hi there!"
            data-heading="Allow me to introduce myself."
            data-description="Transferring words from your brain, to a page, and making your target audience relate is what I do."
            data-btn_text="Read More"
            data-bg_image="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=1600&q=80"
        ></iframe>

        <iframe 
            id="blond-about-stats"
            src=""
            data-base-url="snippets/blond/about-stats.html"
            data-frame-id="blond-about-stats"
            data-head1="What I do?"
            data-text1="I focus on the words so you can focus on the business. From SEO-optimized blog articles to compelling website content and email welcome series."
            data-head2="How I do it?"
            data-text2="I use my research skills, background in digital marketing, and SEO knowledge to craft content that converts."
            data-image="https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&w=600&q=80"
            data-stat1_num="400+" data-stat1_label="Client<br>Collaborations"
            data-stat2_num="6+" data-stat2_label="Years of<br>Experience"
            data-stat3_num="1,300+" data-stat3_label="Projects<br>Completed"
        ></iframe>
    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-') && attr.name !== 'data-base-url' && attr.name !== 'data-frame-id') {
                        params.push(`${attr.name.substring(5)}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&') + '&frame_id=' + iframe.id;
            });
        });
    </script>
</body>
</html>
