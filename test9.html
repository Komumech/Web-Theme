<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blond Theme Test (Test 9)</title>
    <style>
        body { margin: 0; padding: 0; background: #f5f5f5; font-family: sans-serif; }
        .preview { max-width: 1400px; margin: 0 auto; background: white; min-height: 100vh; }
        iframe { width: 100%; border: none; display: block; overflow: hidden; }
    </style>
</head>
<body>
    <div class="preview">
        <iframe 
            id="blond-nav"
            src=""
            data-base-url="https://komutheme2.vercel.app/project/public/snippets//footer.html"
            data-frame-id="blond-nav"
            data-brand="Kalogirou Rania"
            data-link1_text="Home"
            data-link2_text="Pages"
            data-link3_text="Blog"
            data-link4_text="Portfolio"
            data-cta_text="Let's work!"
        ></iframe>

        <iframe 
            id="blond-hero"
            src=""
            data-base-url="snippets/blond/hero.html"
            data-frame-id="blond-hero"
            data-headline="Looking for help with your"
            data-keywords="content?,copy?,strategy?,marketing?"
            data-prob_title="The Problem"
            data-prob_desc="You know what compelling, human-like copy sounds like. But when it comes to writing it, that is a different topic altogether."
            data-sol_title="The Solution"
            data-sol_desc="This is where a content copywriter can come in handy. And this is why you are here."
            data-typing_speed="150"
            data-delete_speed="100"
            data-pause_time="2000"
        ></iframe>
    </div>

    <script>
        window.addEventListener("message", function(event) {
            if (event.data.frameHeight && event.data.frameId) {
                const iframe = document.getElementById(event.data.frameId);
                if (iframe) iframe.style.height = event.data.frameHeight + "px";
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            document.querySelectorAll('iframe[data-base-url]').forEach(iframe => {
                const baseUrl = iframe.getAttribute('data-base-url');
                let params = [];
                for (const attr of iframe.attributes) {
                    if (attr.name.startsWith('data-') && attr.name !== 'data-base-url' && attr.name !== 'data-frame-id') {
                        params.push(`${attr.name.substring(5)}=${encodeURIComponent(attr.value)}`);
                    }
                }
                iframe.src = baseUrl + '?' + params.join('&') + '&frame_id=' + iframe.id;
            });
        });
    </script>
</body>
</html>
